services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rc
      POSTGRES_USER: rc
      POSTGRES_PASSWORD: rc
    ports:
      - "${RC_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc -d rc"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    profiles: ["demo"]
    build: .
    command: ["migrate", "up"]
    environment:
      RC_DATABASE_URL: postgres://rc:rc@postgres:5432/rc?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  rc:
    profiles: ["demo"]
    build: .
    command: ["serve"]
    environment:
      RC_HTTP_ADDR: :8080
      RC_DATABASE_URL: postgres://rc:rc@postgres:5432/rc?sslmode=disable
      RC_API_TOKEN: demo-internal-token
      RC_HEADER_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      RC_LOG_LEVEL: info
      RC_LOG_FORMAT: json
      RC_WORKER_CONCURRENCY: ${RC_WORKER_CONCURRENCY:-4}
      RC_DELIVERY_TIMEOUT: ${RC_DELIVERY_TIMEOUT:-5s}
      RC_POLL_INTERVAL: ${RC_POLL_INTERVAL:-500ms}
      RC_LEASE_DURATION: ${RC_LEASE_DURATION:-30s}
      RC_MAX_ATTEMPTS: ${RC_MAX_ATTEMPTS:-10}
      RC_BASE_BACKOFF: ${RC_BASE_BACKOFF:-5s}
      RC_MAX_BACKOFF: ${RC_MAX_BACKOFF:-15m}
    ports:
      - "${RC_HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  mockreceiver:
    profiles: ["demo"]
    build: .
    entrypoint: ["/app/mockreceiver"]
    environment:
      MOCK_HTTP_ADDR: :8081
      MOCK_FAILURES_BEFORE_SUCCESS: ${MOCK_FAILURES_BEFORE_SUCCESS:-2}
    ports:
      - "${RC_RECEIVER_PORT:-8081}:8081"

volumes:
  postgres-data:
